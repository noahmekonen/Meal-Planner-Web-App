<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="main.css">
        <script src = "main.js"></script>
        <title>Meal Planner App: Preferences</title>
    </head>
    <body>
        <header>
            <nav>
                <button id="back-button">⬅</button>
                <h1 id ="head">Meal Planner</h1>
                
            </nav>
        </header>
        <main>
            <!-- Different preferences for users to choose from -->
            <section id="preferences">
            <h1 class="center-h1">Preferences</h1>
            <label for="name">Your Name:</label>
            <p id="name-error"></p>
            <input id="name">
            <div>
            <label for="meals">Meal Type:</label>
            <select id="meals">
                <option value="breakfast">Breakfast</option>
                <option value="lunch">Lunch</option>
                <option value="dinner">Dinner</option>
            </select>
            </div>
            <div>
            <label for="protein">Protein Choice:</label>
            <select id="protein">
                <option value="meat">Meat</option>
                <option value="seafood">Seafood</option>
                <option value="vegetarian">Vegetarian</option>
            </select>
            </div>
            <div>
            <label for="budget">Budget:</label>
            <select id="budget">
                <option value="ten">$10</option>
                <option value="fifteen">$15+</option>
            </select>
            </div>
            <p id="name-error"></p>
            <div>
            <button id="check-result">Check Results</button>
            </div>
            </section>
            
            <!-- The results based on the users choices -->
            <section id="results">
                <h1>Results</h1>
                <img id="meal-image">
                <p id="source-text">Photo source: <a id = "meal-source" href="">Pexels</a></p>
                <h2 id="meal-name"></h2>
                <p id="meal-description"></p>
            </section>
        </main>
        <footer>
            <p>&copy; 2026 Noah Mekonen</p>
        </footer>
    </body>
</html>
